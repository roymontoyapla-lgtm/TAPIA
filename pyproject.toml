[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapia"
version = "1.2.0"
description = "TAPIA – Triaje Automatizado por IA"
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "reportlab>=4.0",
    "openai>=1.0",
    "streamlit>=1.36",
    "plotly>=5.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25"]
desktop   = ["pillow>=10.0"]   # solo necesario para la UI Tkinter
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tapia-web     = "streamlit:main"   # streamlit run streamlit_app.py
tapia-desktop = "tapia.main:main"  # interfaz Tkinter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

# La raiz del repositorio ES el paquete `tapia` (no hay subcarpeta tapia/),
# asi que se mapea explicitamente en lugar de autodetectar.
[tool.setuptools]
packages = [
    "tapia",
    "tapia.ai",
    "tapia.auth",
    "tapia.compliance",
    "tapia.core",
    "tapia.db",
    "tapia.export",
    "tapia.ui",
    "tapia.ui.streamlit_pages",
    "tapia.wearables",
]

[tool.setuptools.package-dir]
"tapia" = "."
